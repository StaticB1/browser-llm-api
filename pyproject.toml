[build-system]
requires = ["setuptools>=77"]   # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "browser-llm-api"
description = "OpenAI-compatible API over your signed-in ChatGPT and Gemini web sessions, with design tools that make website sections, app screens and brand images with ChatGPT's image tool."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "staticB1", email = "bsiwonde@gmail.com" },
    { name = 'Ebenezer "Ebstar" Tarubinga', email = "ebstarmusic@gmail.com" },
]
keywords = ["llm", "openai", "gemini", "chatgpt", "browser-automation", "nodriver", "fastapi", "image-generation", "design", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dynamic = ["version"]

dependencies = [
    "nodriver>=0.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "httpx>=0.27",              # downloads http(s) image attachments
    "python-multipart>=0.0.9",  # multipart uploads on /v1/images/edits
    "Pillow>=10",               # image shaping, design sets, measured colours
]

[project.optional-dependencies]
# Before 2.0 Pillow was optional; the extra stays so old install lines still work.
assets = ["Pillow>=10"]

[project.scripts]
browser-llm = "browser_llm.cli:main"
browser-llm-mcp = "browser_llm.mcp_server:main"
browser-llm-design = "browser_llm.design:main"

[project.urls]
Homepage = "https://github.com/StaticB1/browser-llm-api"
Repository = "https://github.com/StaticB1/browser-llm-api"
Issues = "https://github.com/StaticB1/browser-llm-api/issues"
Changelog = "https://github.com/StaticB1/browser-llm-api/blob/master/CHANGELOG.md"

# One package, browser_llm/, with the dashboard and widget shipped inside it.
# The top-level gen_asset.py, design.py, client.py and *.sh are forwarding files
# for callers that use the old paths; they are not part of the wheel.
[tool.setuptools.packages.find]
include = ["browser_llm*"]

[tool.setuptools.package-data]
browser_llm = ["webui/*.html", "webui/*.js"]

[tool.setuptools.dynamic]
version = { attr = "browser_llm._version.__version__" }

[tool.ruff]
line-length = 110
exclude = ["venv", "build", "dist", "graphify-out", "*_profile"]

[tool.ruff.lint]
# pycodestyle + pyflakes + warnings. Deliberately NOT bugbear: its B904
# ("raise ... from err") would mean touching eight exception handlers in
# server.py, which is the most fragile file here, for no behaviour change.
select = ["E", "F", "W"]
ignore = ["E501"]   # length is enforced by line-length above, not as an error

[tool.ruff.lint.per-file-ignores]
# PyGObject requires gi.require_version() to run BEFORE the gi.repository
# imports, so module-level imports genuinely cannot all sit at the top.
"desktop/browser_llm_desktop.py" = ["E402"]
