# Runs on GitHub-hosted runners, which need the account's Actions billing to be in
# good standing — as of 2026-08-18 it is not, and every run is refused before it
# starts ("job was not started because your account is locked due to a billing
# issue"). Nothing below is wrong; each step was verified locally. Once billing is
# sorted, put the badge back at the top of README.md:
#   [![CI](https://github.com/StaticB1/browser-llm-api/actions/workflows/ci.yml/badge.svg)](https://github.com/StaticB1/browser-llm-api/actions/workflows/ci.yml)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      # No browser and no network: the suite covers the completion decision,
      # the authz rules, the attachment layer and the MCP protocol framing.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Package installs
        run: |
          pip install -e .
          python -c "import server, client, authz, gen_asset, mcp_server, login"

      - name: MCP server answers a handshake
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 python mcp_server.py > frames.jsonl
          python - <<'EOF'
          import json
          frames = [json.loads(l) for l in open("frames.jsonl") if l.strip()]
          init = next(f for f in frames if f.get("id") == 1)["result"]
          tools = next(f for f in frames if f.get("id") == 2)["result"]["tools"]
          assert init["serverInfo"]["name"] == "browser-llm", init
          assert {t["name"] for t in tools} == {"ask", "generate_image", "list_models", "health"}, tools
          print(f"handshake ok, {len(tools)} tools advertised")
          EOF
