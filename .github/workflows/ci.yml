# Runs on GitHub-hosted runners, which need the account's Actions billing to be in
# good standing. From 2026-08-18 to at least 2026-10-14 every run was refused before
# it started ("job was not started because your account is locked due to a billing
# issue"), so each step below was run by hand for every release in that period
# (docs/releasing.md). Once billing is sorted, put the badge back at the top of README.md:
#   [![CI](https://github.com/StaticB1/browser-llm-api/actions/workflows/ci.yml/badge.svg)](https://github.com/StaticB1/browser-llm-api/actions/workflows/ci.yml)
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BROWSER_LLM_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff build

      - name: Lint
        run: ruff check .

      # No browser and no network: the completion decision, access rules,
      # attachments, history, MCP framing, selectors, limits, design tools,
      # the .env file and the command.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Package installs editable
        run: |
          pip install -e .
          python -c "import browser_llm.server, browser_llm.client, browser_llm.authz, browser_llm.gen_asset, browser_llm.design, browser_llm.mcp_server, browser_llm.login"
          browser-llm version
          browser-llm design kinds > /dev/null

      - name: Wheel builds and installs with the dashboard inside
        run: |
          python -m build --outdir dist .
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/browser-llm version
          /tmp/wheel-env/bin/python -c "from browser_llm import server; import pathlib; assert (pathlib.Path(server._WEBUI_DIR) / 'index.html').is_file()"

      - name: MCP server answers a handshake
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 python -m browser_llm mcp > frames.jsonl
          python - <<'EOF'
          import json
          frames = [json.loads(l) for l in open("frames.jsonl") if l.strip()]
          init = next(f for f in frames if f.get("id") == 1)["result"]
          tools = next(f for f in frames if f.get("id") == 2)["result"]["tools"]
          assert init["serverInfo"]["name"] == "browser-llm", init
          assert {t["name"] for t in tools} == {"ask", "generate_image", "design_set", "design_tokens",
                                                 "design_review", "list_models", "health"}, tools
          print(f"handshake ok, {len(tools)} tools advertised")
          EOF
